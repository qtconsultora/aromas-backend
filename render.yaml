services:
  - type: web
    name: aromas-backend
    runtime: python
    plan: starter
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi --log-file -
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: aromas-db
          property: connectionString

databases:
  - name: aromas-db
    plan: 0.1c-256mb # ~USD 6/mes, el reemplazo del viejo plan "Starter" (ya no se puede crear)
